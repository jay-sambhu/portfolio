<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p4Bg)" />

  <g transform="translate(40, 30)">
    <rect width="520" height="300" rx="12" fill="#030712" stroke="#374151" stroke-width="2" />
    
    <!-- Video Player Preview Viewport -->
    <rect x="20" y="20" width="480" height="200" rx="8" fill="#111827" />
    
    <!-- Screen content: Waveform / timeline visualizer -->
    <path d="M 40 120 Q 90 40, 140 120 T 240 120 T 340 70 T 440 120" fill="none" stroke="url(#streamGrad)" stroke-width="3" opacity="0.8" />
    <path d="M 40 135 Q 90 80, 140 135 T 240 135 T 340 100 T 440 135" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Center Play/Pause button on player -->
    <circle cx="260" cy="110" r="28" fill="rgba(15, 23, 42, 0.75)" stroke="#f43f5e" stroke-width="2" />
    <polygon points="254,98 274,110 254,122" fill="#ffffff" />

    <!-- Video control timeline bar -->
    <g transform="translate(20, 235)">
      <!-- Scrub track -->
      <rect width="480" height="8" rx="4" fill="#374151" />
      <rect width="280" height="8" rx="4" fill="url(#streamGrad)" />
      <circle cx="280" cy="4" r="7" fill="#ffffff" />

      <!-- Controls row -->
      <g transform="translate(0, 25)">
        <polygon points="10,0 20,7 10,14" fill="#f8fafc" />
        <rect x="35" y="2" width="12" height="10" rx="1" fill="#94a3b8" />
        <text x="60" y="11" fill="#94a3b8" font-family="monospace" font-size="11">14:28 / 24:00</text>
        <text x="430" y="11" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">4K 60FPS</text>
      </g>
    </g>
  </g>
</svg>
