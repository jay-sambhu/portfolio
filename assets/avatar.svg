<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2ab86" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular background frame -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#glowCircle)" stroke-width="4" stroke-dasharray="12 6" />

  <!-- Background decorative tech nodes -->
  <circle cx="90" cy="110" r="4" fill="#818cf8" opacity="0.6" />
  <circle cx="310" cy="130" r="5" fill="#ec4899" opacity="0.6" />
  <circle cx="330" cy="270" r="3" fill="#6366f1" opacity="0.5" />
  <circle cx="70" cy="280" r="4" fill="#38bdf8" opacity="0.6" />
  <line x1="90" y1="110" x2="130" y2="140" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
  <line x1="310" y1="130" x2="270" y2="160" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />

  <!-- Avatar Silhouette / Figure -->
  <!-- Hoodie / Shoulders -->
  <path d="M100 370 C100 290 140 260 200 260 C260 260 300 290 300 370 Z" fill="url(#hoodieGrad)" filter="url(#shadowFilter)" />
  <path d="M170 260 C170 285 200 300 200 300 C200 300 230 285 230 260 Z" fill="#1e1b4b" opacity="0.6" />

  <!-- Neck -->
  <rect x="182" y="210" width="36" height="50" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" filter="url(#shadowFilter)" />

  <!-- Hair -->
  <path d="M142 170 C140 120 170 100 200 100 C235 100 260 120 258 170 C245 135 220 125 200 125 C180 125 155 135 142 170 Z" fill="url(#hairGrad)" />

  <!-- Glasses / Modern Eyewear -->
  <rect x="160" y="165" width="34" height="22" rx="6" fill="#0f172a" fill-opacity="0.2" stroke="#e0e7ff" stroke-width="3" />
  <rect x="206" y="165" width="34" height="22" rx="6" fill="#0f172a" fill-opacity="0.2" stroke="#e0e7ff" stroke-width="3" />
  <line x1="194" y1="176" x2="206" y2="176" stroke="#e0e7ff" stroke-width="3" />
  <!-- Glass glare reflection -->
  <line x1="166" y1="170" x2="184" y2="182" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="212" y1="170" x2="230" y2="182" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Smile -->
  <path d="M188 215 Q200 225 212 215" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing code badge -->
  <g transform="translate(145, 330)">
    <rect width="110" height="32" rx="16" fill="#0f172a" stroke="url(#glowCircle)" stroke-width="1.5" />
    <text x="55" y="20" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">&lt;coder /&gt;</text>
  </g>
</svg>
