<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p3Bg)" />

  <!-- Ambient glowing spheres -->
  <circle cx="150" cy="100" r="80" fill="#f43f5e" opacity="0.25" filter="blur(30px)" />
  <circle cx="450" cy="240" r="90" fill="#06b6d4" opacity="0.2" filter="blur(30px)" />

  <!-- Glass Card 1 (Main) -->
  <g transform="translate(60, 45)">
    <rect width="320" height="240" rx="16" fill="url(#glassGrad)" stroke="url(#cyberBorder)" stroke-width="1.5" />
    <text x="25" y="40" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">CyberNexus UI</text>
    <text x="25" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Next-gen glassmorphic token system</text>

    <!-- UI Components inside -->
    <rect x="25" y="90" width="130" height="36" rx="8" fill="#f43f5e" />
    <text x="90" y="113" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Primary Action</text>

    <rect x="170" y="90" width="120" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
    <text x="230" y="113" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Ghost Button</text>

    <!-- Slider component -->
    <text x="25" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="11">ACCENT LUMINOSITY</text>
    <rect x="25" y="175" width="265" height="6" rx="3" fill="#334155" />
    <rect x="25" y="175" width="170" height="6" rx="3" fill="url(#cyberBorder)" />
    <circle cx="195" cy="178" r="8" fill="#ffffff" />

    <!-- Badges -->
    <g transform="translate(25, 205)">
      <rect width="55" height="20" rx="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" />
      <text x="27" y="14" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">WCAG AAA</text>
    </g>
    <g transform="translate(90, 205)">
      <rect width="60" height="20" rx="10" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" />
      <text x="30" y="14" fill="#c084fc" font-family="sans-serif" font-size="9" text-anchor="middle">0 RUNTIME</text>
    </g>
  </g>

  <!-- Floating Glass Card 2 (Secondary overlay) -->
  <g transform="translate(340, 90)">
    <rect width="200" height="190" rx="16" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <circle cx="40" cy="40" r="18" fill="#10b981" />
    <path d="M 33 40 L 38 45 L 48 35" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="70" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Modular</text>
    <text x="70" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Plug &amp; play theme</text>

    <line x1="20" y1="80" x2="180" y2="80" stroke="rgba(255,255,255,0.1)" />

    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="11">Design Tokens: 48</text>
    <text x="20" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="11">CSS Variables: 100%</text>
    <text x="20" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="11">Dark/Light Auto: Yes</text>
  </g>
</svg>
