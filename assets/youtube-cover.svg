<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180708" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#2a080c" />
    </linearGradient>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="ytGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#ff0000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#ytBg)" />

  <!-- Diagonal dynamic background accents -->
  <polygon points="0,0 350,0 150,450 0,450" fill="#dc2626" opacity="0.08" />
  <polygon points="500,0 800,0 800,450 650,450" fill="#6366f1" opacity="0.06" />

  <!-- Grid mesh -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Big YouTube Play Badge Icon -->
  <g transform="translate(400, 200)" filter="url(#ytGlow)">
    <rect x="-80" y="-55" width="160" height="110" rx="30" fill="url(#ytRed)" />
    <polygon points="-15,-28 35,0 -15,28" fill="#ffffff" />
  </g>

  <!-- Channel Banner Text Overlay -->
  <text x="400" y="320" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">CODE • CREATE • BUILD</text>
  <text x="400" y="355" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">Tech Tutorials, Web Development &amp; Creative Coding</text>

  <!-- Live/Subscribers Badge -->
  <g transform="translate(400, 395)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <circle cx="-65" cy="0" r="5" fill="#ef4444" />
    <text x="5" y="5" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Watch Latest Videos</text>
  </g>
</svg>
