<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p1Bg)" />

  <!-- Code editor mockup window -->
  <g transform="translate(40, 30)">
    <rect width="520" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Window header bar -->
    <rect width="520" height="36" rx="12" fill="#0f172a" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="260" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">DevFlow Studio - app.js</text>

    <!-- Editor sidebar -->
    <rect x="0" y="36" width="130" height="264" fill="#111827" />
    <rect x="15" y="55" width="80" height="8" rx="4" fill="#475569" />
    <rect x="25" y="75" width="70" height="6" rx="3" fill="#334155" />
    <rect x="25" y="95" width="85" height="6" rx="3" fill="url(#p1Accent)" />
    <rect x="25" y="115" width="60" height="6" rx="3" fill="#334155" />
    <rect x="25" y="135" width="75" height="6" rx="3" fill="#334155" />

    <!-- Code lines -->
    <g transform="translate(150, 55)">
      <text x="0" y="16" fill="#f43f5e" font-family="monospace" font-size="13">const</text>
      <text x="50" y="16" fill="#38bdf8" font-family="monospace" font-size="13">workspace</text>
      <text x="140" y="16" fill="#f8fafc" font-family="monospace" font-size="13">=</text>
      <text x="160" y="16" fill="#a855f7" font-family="monospace" font-size="13">new</text>
      <text x="195" y="16" fill="#f59e0b" font-family="monospace" font-size="13">DevFlow()</text>

      <text x="0" y="42" fill="#94a3b8" font-family="monospace" font-size="13">// Auto-sync live modules</text>

      <text x="0" y="68" fill="#f43f5e" font-family="monospace" font-size="13">await</text>
      <text x="50" y="68" fill="#38bdf8" font-family="monospace" font-size="13">workspace</text>
      <text x="135" y="68" fill="#f8fafc" font-family="monospace" font-size="13">.deploy({</text>

      <text x="20" y="94" fill="#a855f7" font-family="monospace" font-size="13">bundler:</text>
      <text x="95" y="94" fill="#10b981" font-family="monospace" font-size="13">"instant-zero-config"</text>
      <text x="290" y="94" fill="#f8fafc" font-family="monospace" font-size="13">,</text>

      <text x="20" y="120" fill="#a855f7" font-family="monospace" font-size="13">optimized:</text>
      <text x="110" y="120" fill="#f43f5e" font-family="monospace" font-size="13">true</text>

      <text x="0" y="146" fill="#f8fafc" font-family="monospace" font-size="13">});</text>
    </g>

    <!-- Floating status pill -->
    <g transform="translate(320, 220)">
      <rect width="170" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="35" y="23" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Build 100% Passing</text>
    </g>
  </g>
</svg>
