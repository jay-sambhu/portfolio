<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Bg)" />

  <g transform="translate(40, 30)">
    <rect width="520" height="300" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <!-- Header -->
    <rect width="520" height="36" rx="12" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="260" y="22" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">PulseAnalytics - Live Dashboard</text>

    <!-- Mini KPI cards -->
    <g transform="translate(20, 50)">
      <rect width="140" height="60" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL EVENTS</text>
      <text x="12" y="48" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">1.24M</text>
    </g>

    <g transform="translate(190, 50)">
      <rect width="140" height="60" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">P99 LATENCY</text>
      <text x="12" y="48" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">18ms</text>
    </g>

    <g transform="translate(360, 50)">
      <rect width="140" height="60" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">HEALTH SCORE</text>
      <text x="12" y="48" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="bold">99.8%</text>
    </g>

    <!-- Chart graph area -->
    <g transform="translate(20, 130)">
      <rect width="480" height="150" rx="8" fill="#111827" stroke="#1f2937" />
      <!-- Grid lines -->
      <line x1="0" y1="35" x2="480" y2="35" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="0" y1="75" x2="480" y2="75" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="0" y1="115" x2="480" y2="115" stroke="#1e293b" stroke-dasharray="4 4" />

      <!-- Area fill -->
      <path d="M 10 120 Q 70 90, 120 100 T 220 50 T 320 65 T 400 30 T 470 15 L 470 145 L 10 145 Z" fill="url(#chartGrad)" />
      <!-- Line curve -->
      <path d="M 10 120 Q 70 90, 120 100 T 220 50 T 320 65 T 400 30 T 470 15" fill="none" stroke="url(#neonLine)" stroke-width="3" stroke-linecap="round" />

      <!-- Highlight point -->
      <circle cx="400" cy="30" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
      <text x="390" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Peak Traffic</text>
    </g>
  </g>
</svg>
